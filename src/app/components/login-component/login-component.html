<h1>{{ 'LOGIN' | t }}</h1>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
        <input type="text" placeholder="{{ 'EMAIL' | t }}" formControlName="email"/>
    </div>
    <div>
        <input type="password" placeholder="{{ 'PASSWORD' | t }}" formControlName="password"/>
    </div>
    <div>
        <button type="submit">{{ 'SUBMIT' | t }}</button>
    </div>
</form>
