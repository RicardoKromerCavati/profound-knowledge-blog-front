<div class="container">
    @if(authService.currentUserSignal() === null){
    <form [formGroup]="createFormGroup" (ngSubmit)="submitPostCreation()">

        <div class="form-group">
            <label>{{ 'TITLE' | t }}</label>
            <input type="text" placeholder="{{ 'WRITE_CREATIVE_TITLE_HERE' | t }}" formControlName="title" />
        </div>

        <div class="form-group">
            <label>{{ 'CONTENT' | t }}</label>
            <textarea class="inputs" placeholder="{{ 'WRITE_YOUR_THOUGHTS_HERE' | t}}"
                formControlName="content"></textarea>
        </div>

        <div class="form-group">
            <label class="custom-file-upload" for="file">{{ 'SELECT_IMAGE_FOR_POST' | t }}</label>
            <input class="hidden-file-input" id="file" type="file" (change)="onFileChange($event)"
                accept=".jpg, .jpeg, .png" />
            @if (createFormGroup.get('fileSource')?.value) {
            <span class="file-name">
                {{ 'SELECTED_FILE_LABEL' | t }}:
                {{ createFormGroup.get('fileSource')?.value?.name }}
            </span>
            }
        </div>

        <div class="center-container">
            <button type="submit" [disabled]="createFormGroup.invalid">
                {{ 'CREATE' | t }}
            </button>
        </div>

    </form>
    }
    @else {

    <div>
        {{ 'YOU_MUST_CONNECT' | t }}
    </div>

    }
</div>
